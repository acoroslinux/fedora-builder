---
# Post-install Fedora setup: dracut initramfs rebuild, SELinux relabel, locale
dontChroot: false
timeout: 600
script:
    # Rebuild initramfs for all installed kernels
    - command: "for kver in $(ls /boot/vmlinuz-* | grep -v rescue | sed 's|/boot/vmlinuz-||'); do dracut -f --kver \"$kver\"; done"
    # Generate machine-id
    - command: "systemd-machine-id-setup"
    # Enable SELinux autorelabel on first boot if enforcing/permissive
    - command: "if [ -f /etc/selinux/config ]; then touch /.autorelabel; fi"
    # Remove live user if still present (removeuser module may have failed)
    - command: "userdel -r liveuser 2>/dev/null || true"
    # Disable live-specific services
    - command: "systemctl disable live-get-config.service 2>/dev/null || true"
    - command: "systemctl disable liveuser-late-audio.service 2>/dev/null || true"
    # Ensure NetworkManager is enabled
    - command: "systemctl enable NetworkManager"
    # Fix /etc/resolv.conf symlink for systemd-resolved
    - command: "ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf || true"
