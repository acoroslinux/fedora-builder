---
# EFI bootloader: grub2 (Fedora standard)
efiBootLoader: "grub"

kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz-[^r]"

# systemd-boot entries (not used but kept for completeness)
loaderEntries:
  - "timeout 5"
  - "console-mode keep"

kernelParams: [ "quiet", "rhgb" ]

# Fedora uses grub2 binary names
efiBootloaderId: "fedora"
grubInstall: "grub2-install"
grubMkconfig: "grub2-mkconfig"
grubCfg: "/boot/grub2/grub.cfg"
grubProbe: "grub2-probe"
efiBootMgr: "efibootmgr"

# Install EFI fallback loader for maximum compatibility
installEFIFallback: true

# Generate both BIOS and UEFI grub on hybrid systems
installHybridGRUB: true
